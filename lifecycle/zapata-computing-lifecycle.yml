summary: >-
  Zapata publishes no API, so there is no API versioning policy, no deprecation policy, no Sunset /
  Deprecation header contract, no SLA and no status page. What lifecycle signal does exist belongs to
  the Orquestra open-source stack and to the company itself, and both are material: the company
  ceased operations on 2024-10-09 and the entire Orquestra package stack stopped there.
