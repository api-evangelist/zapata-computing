title: Orquestra Workflow SDK CLI
description: >-
  `orq` is the first-party command-line interface shipped by Zapata inside the orquestra-sdk Python
  package. It submits and inspects Orquestra workflow runs locally and against remote Orquestra
  Compute Engine clusters. It is the only first-party CLI Zapata publishes; there is no separate
  binary release, homebrew tap or installer.
