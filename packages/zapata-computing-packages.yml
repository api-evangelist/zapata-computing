name: Zapata Quantum packages
summary: >-
  Zapata publishes no REST/GraphQL API and no API client SDKs. What it does publish is the Orquestra
  open-source Python stack — a workflow DSL/runtime plus quantum-computing libraries — under Apache-2.0
  on PyPI. Every entry below was confirmed first-party from the PyPI `author_email` field, which reads
  "Zapata Computing Inc." <info@zapatacomputing.com> (orquestra-workflow-runtime reads info@zapata.ai,
  the company's second brand). The whole stack is FROZEN: the newest release in the set is
  2024-10-04, five days before the company ceased operations on 2024-10-09.
official: true
registries_checked:
- pypi
- npm
- rubygems
- crates.io
- nuget
- maven-central
- pkg.go.dev
