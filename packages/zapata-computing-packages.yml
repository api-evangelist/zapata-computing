notes:
- npm has a package named `orquestra` (0.2.1) but it is an unrelated Brazilian TFS CLI published by
  maintainer `prodamsp` with no link to Zapata — NOT included here.
- The documentation URL declared in orquestra-sdk's PyPI project_urls, https://docs.orquestra.io, no
  longer resolves (NXDOMAIN as of 2026-09-05). See lifecycle/zapata-computing-lifecycle.yml.
