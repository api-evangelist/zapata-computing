aid: zapata-computing
name: Zapata Quantum
description: 'Zapata Quantum, Inc. (formerly Zapata Computing, and briefly Zapata AI) is a Boston-based,
  hardware-agnostic quantum software company spun out of a Harvard quantum computing lab in 2017. It sells
  enterprise engagements — use-case discovery, hardware-readiness assessment and quantum application
  development across chemistry, optimization, simulation and machine learning — around its Orquestra
  platform, and publishes the Orquestra Workflow SDK stack as Apache-2.0 open source. The company ceased
  operations in October 2024 after a debt acceleration, restructured through 2025, and relaunched under the
  Zapata Quantum name in 2026. It publishes no public API, developer portal, API reference or self-serve
  signup; its only machine-readable developer surface is the Orquestra Python package stack on PyPI and the
  `orq` CLI, both frozen at their October 2024 releases.'
